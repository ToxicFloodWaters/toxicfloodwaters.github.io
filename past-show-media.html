<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Archive detail for a Toxic Flood Waters show media item." />
    <title>Toxic Flood Waters | Archive Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-noise"></div>

    <header class="topbar">
      <div class="brand-wrap">
        <a class="brand-link" href="index.html" aria-label="Toxic Flood Waters home">
          <img class="brand-mark brand-logo" src="Tfw-logo.jpg" alt="Toxic Flood Waters logo" />
        </a>
        <div>
          <p class="eyebrow">Archive detail</p>
          <h1>Toxic Flood Waters</h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="book-button" href="upcoming-shows.html">Upcoming shows</a>
        <a class="book-button" href="index.html">Home</a>
      </div>
    </header>

    <main class="page-shell detail-shell">
      <section class="panel detail-panel">
        <a id="back-link" class="text-link" href="upcoming-shows.html">← Back to upcoming shows</a>
        <div class="detail-layout">
          <div class="detail-visual">
            <img id="detail-image" class="detail-image" src="" alt="" />
          </div>
          <div class="detail-copy">
            <p class="eyebrow accent" id="detail-subtitle">Archive</p>
            <h2 id="detail-title">Past show media</h2>
            <p id="detail-description" class="lede"></p>
            <p id="detail-text" class="detail-text"></p>

        </div>

    </main>

    <script src="media-data.js"></script>
