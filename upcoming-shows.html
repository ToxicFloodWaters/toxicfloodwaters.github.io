<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upcoming Toxic Flood Waters live dates and event flyers." />
    <title>Toxic Flood Waters | Upcoming Shows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-noise"></div>
    <header class="topbar">
      <div class="brand-wrap">
        <a class="brand-link" href="index.html" aria-label="Toxic Flood Waters home">
          <img class="brand-mark brand-logo" src="Tfw-logo.jpg" alt="Toxic Flood Waters logo" />
        </a>
        <div>
          <p class="eyebrow">Upcoming shows</p>
          <h1>Toxic Flood Waters</h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="book-button" href="index.html">Fans</a>
        <a class="book-button" href="past-show-media.html">Archive</a>
        <a class="book-button" href="booking.html">Book the band</a>
      </div>
    </header>
    <main class="page-shell">
      <section class="hero panel compact-hero">
        <div class="hero-copy">
          <p class="eyebrow accent">Live dates</p>
          <h2>Upcoming appearances.</h2>
          <p class="lede">Flyers, city details, and the latest live dates from the band’s tour calendar.</p>
        </div>
        <div class="hero-stats">
          <div>
            <span class="stat-label">Next stop</span>
            <strong id="next-stop">Loading…</strong>
          </div>
          <div>
            <span class="stat-label">Status</span>
            <strong>Live calendar</strong>
          </div>
        </div>
      </section>
      <section class="calendar-section panel">
        <div class="section-header">
          <div>
            <p class="eyebrow accent">Schedule</p>
            <h3>Upcoming shows</h3>
          </div>
          <div class="status-legend">
            <span><i class="dot confirmed"></i>Confirmed</span>
            <span><i class="dot tentative"></i>Tentative</span>
          </div>
        </div>
        <div id="show-list" class="show-list" aria-live="polite"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
